<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Export Player Frames</title>
  <style>
    body { margin: 0; padding: 24px 16px; font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif; color: #1f2529; background: #f4f2ee; }
    main { max-width: 640px; margin: 0 auto; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    button { min-height: 44px; padding: 0 18px; border: 0; border-radius: 8px; color: #fff; background: #2368a2; font: inherit; cursor: pointer; }
    button:disabled { opacity: 0.5; }
    ol { padding-left: 22px; }
    .done { color: #2f7a4f; }
    .builder { position: fixed; left: -10000px; top: 0; width: 1280px; height: 900px; border: 0; visibility: hidden; }
  </style>
</head>
<body>
  <main>
    <h1>Export player frames</h1>
    <p>Draws every Polka and Waltz story with the planner and saves them into <code>app/frames/</code> and <code>app/stories.js</code>. Keep this tab in front while it runs.</p>
    <button id="go" type="button" disabled>Loading planner…</button>
    <p id="status"></p>
    <ol id="log"></ol>
  </main>
  <iframe id="builder" class="builder" title="Planner" aria-hidden="true"></iframe>
  <script>
    const SECTIONS = ["Polka", "Waltz"];
    const SIZE = 1080;
    const go = document.querySelector("#go");
    const statusEl = document.querySelector("#status");
    const log = document.querySelector("#log");
    const builder = document.querySelector("#builder");
    builder.src = `../index.html?builder=${Date.now()}`;
    let presets = [];
    let waiting = null;

    window.addEventListener("message", (event) => {
      if (event.source !== builder.contentWindow) return;
      const data = event.data || {};
      if (data.type === "opening-2027-presets") {
        presets = data.presets.filter((preset) => SECTIONS.includes(preset.section));
        go.disabled = false;
        go.textContent = `Export ${presets.length} stories`;
      } else if (data.type === "opening-2027-frames-progress") {
        statusEl.textContent = `Drawing ${data.id}: ${data.done} of ${data.total}`;
      } else if ((data.type === "opening-2027-frames" || data.type === "opening-2027-preset-error") && waiting) {
        waiting(data);
        waiting = null;
      }
    });

    const save = async (path, body) => {
      const response = await fetch(`/save?path=${encodeURIComponent(path)}`, { method: "POST", body });
      if (!response.ok) throw new Error(`Could not save ${path}`);
    };

    go.addEventListener("click", async () => {
      go.disabled = true;
      log.replaceChildren();
      try {
        await fetch("/reset", { method: "POST" });
        const stories = [];
        for (const preset of presets) {
          const result = await new Promise((resolve) => {
            waiting = resolve;
            builder.contentWindow.postMessage({ type: "opening-2027-build-frames", id: preset.id, size: SIZE }, "*");
          });
          if (result.type !== "opening-2027-frames") throw new Error(`${preset.name}: ${result.message || "could not draw"}`);
          const frames = [];
          for (const [i, frame] of result.frames.entries()) {
            const ext = frame.blob.type === "image/webp" ? "webp" : "jpg";
            const src = `frames/${preset.id}/${String(i + 1).padStart(2, "0")}.${ext}`;
            await save(src, frame.blob);
            frames.push({ src, title: frame.title, subtitle: frame.subtitle, note: frame.note });
          }
          stories.push({ id: preset.id, name: preset.name, section: preset.section, frames });
          const item = document.createElement("li");
          item.textContent = `${preset.name}: ${frames.length} frames`;
          log.append(item);
        }
        const updated = new Date().toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
        const manifest = { updated, sections: SECTIONS, stories };
        await save("stories.js", `// Made by tools/export-player.html. Redraw with: python3 tools/export_player.py\nwindow.PLAYER_MANIFEST = ${JSON.stringify(manifest, null, 1)};\n`);
        statusEl.innerHTML = `<span class="done">Done: ${stories.length} stories saved. Commit and push app/ to update the player.</span>`;
      } catch (error) {
        statusEl.textContent = `Stopped: ${error.message}`;
      }
      go.disabled = false;
    });
  </script>
</body>
</html>
