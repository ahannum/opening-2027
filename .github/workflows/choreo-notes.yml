# Copies the choreo notes (measure tables) from the PUBLIC Ground Truth decks into deck/notes.json,
# which the phone player shows under the board. Deck edits don't push anything, so this runs every
# 15 minutes (GitHub can start scheduled runs a little late); it commits only when the notes changed.
# Run it right away from the Actions tab ("Choreo notes" → Run workflow).
name: Choreo notes

on:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths:
      - tools/sync_notes.py
      - .github/workflows/choreo-notes.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: choreo-notes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy the notes from the decks
        run: python3 tools/sync_notes.py

      - name: Commit any changes
        run: |
          git add deck/notes.json
          if git diff --cached --quiet; then
            echo "Choreo notes already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update choreo notes from the Ground Truth decks"
          # Another workflow or a person may have pushed meanwhile: they only ever touch other files, so
          # rebasing onto theirs is always clean. Try a few times in case of a near-simultaneous push.
          for attempt in 1 2 3 4 5; do
            git pull --rebase && git push && exit 0
            sleep $((attempt * 5))
          done
          exit 1
